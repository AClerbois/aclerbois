name: Latest blog posts
on:
  schedule:
    - cron: '0 * * * *'   # toutes les heures
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://blog.senseof.tech/feed.xml"
          max_post_count: 5
          readme_path: ./readme.md
